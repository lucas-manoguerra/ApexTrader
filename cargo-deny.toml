# cargo-deny configuration for ApexTrader
#
# Audits dependencies for licenses, vulnerabilities, and notices.
# Run with: cargo deny check
# Install: cargo install cargo-deny

[licenses]
# Licenses we explicitly deny in the project.
# AGPL-family licenses are viral and incompatible with a proprietary trading terminal.
deny = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]

# Licenses that require manual review before approval.
review = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unlicense",
    "Zlib",
]

# The default action for licenses not listed above.
# "allow" = permit without review; "deny" = block; "review" = flag for review.
default = "allow"

[vulnerabilities]
# The advisory database to use.
advisories = { 
  db = { 
    # Cache the advisory database for one day to avoid re-downloading on every CI run.
    cached-until = "2026-12-01T00:00:00Z" 
  } 
}

# Unmaintained crates are a supply-chain risk for a long-lived trading terminal.
# Warn when a dependency hasn't been updated in over 2 years.
unmaintained = { 
  threshold = "2y" 
}

[yanked]
# Deny using yanked versions of crates.
deny = { 
  # Allow yanked versions that were yanked for non-security reasons (e.g. accidental publish).
  allow = [ 
    # Example: "serde_json" 
  ] 
}

[notice]
# URLs to the license files of dependencies we redistribute (if any).
# Add entries here when we bundle third-party software in releases.
# urls = [
#   "https://example.com/dependency/LICENSE",
# ]

[banner]
# Show a banner in the output when deny finds issues.
enable = true
