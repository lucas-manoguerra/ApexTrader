[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Bitstream-Vera",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true
