[package]
name = "apex-trader"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11"] }
egui = "0.37"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytemuck = "1"
bytemuck_derive = "1"
rust_decimal = { version = "1.43", features = ["maths", "serde"] }
wgpu = { version = "30", features = ["wgsl"] }

[[bench]]
name = "chart_transform_benchmark"
harness = false

[dev-dependencies]
proptest = "1"
